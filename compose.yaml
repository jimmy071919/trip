name: map-trip-planner

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trip}
      POSTGRES_USER: ${POSTGRES_USER:-trip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logging
    # no "ports": the database is only reachable from the api container

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trip}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-}
      # empty values fall back to the built-in OpenStreetMap defaults
      TILE_URL: ${TILE_URL:-}
      TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
      TILE_MAX_ZOOM: ${TILE_MAX_ZOOM:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_PLACES_LANGUAGE: ${GOOGLE_PLACES_LANGUAGE:-}
      TZ: ${TZ:-Asia/Taipei}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    logging: *logging

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    logging: *logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
